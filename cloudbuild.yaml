steps:
  # 1. Install frontend dependencies
  - name: 'node:22'
    id: 'install-frontend'
    dir: 'frontend'
    entrypoint: npm
    args: ['install']

  # 2. Build frontend production bundle
  - name: 'node:22'
    id: 'build-frontend'
    dir: 'frontend'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_FIREBASE_PROJECT_ID=$PROJECT_ID'
      - 'VITE_FIREBASE_API_KEY=AIzaSyDemoKeyBloodBankApp2026ValidFormatX'
      - 'VITE_API_URL='

  # 3. Copy frontend distribution into backend static assets
  - name: 'bash'
    id: 'copy-frontend-to-backend'
    args: ['cp', '-r', 'frontend/dist', 'backend/static_dist']

  # 4. Build unified full-stack container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:$BUILD_ID', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:latest', './backend']

  # 5. Push backend container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-image'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:latest']

  # 6. Deploy full-stack service to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blood-bank-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FLASK_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/blood-bank-api:latest'

timeout: '1200s'
